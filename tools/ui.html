<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>UI sandbox · Indy's Adventure 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; overscroll-behavior: none; }
    /* fake "game": animated sky gradient + a flat tower silhouette standing in for the 3D scene */
    #game { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #game .sky { position: absolute; inset: -20%; background-size: 100% 200%; animation: sky 14s ease-in-out infinite alternate; }
    body[data-bg="sunset"] #game .sky { background-image: linear-gradient(180deg, #2b3a7a 0%, #7c4fa0 22%, #f0708a 42%, #ffb35c 60%, #ffe2a0 75%, #ffb35c 100%); }
    body[data-bg="day"] #game .sky { background-image: linear-gradient(180deg, #8fd6ff 0%, #c9ecff 35%, #ffffff 55%, #fff7d6 75%, #c9ecff 100%); }
    body[data-bg="night"] #game .sky { background-image: linear-gradient(180deg, #05060f 0%, #12163a 40%, #241a40 70%, #05060f 100%); }
    @keyframes sky { from { background-position: 0 0; } to { background-position: 0 100%; } }
    #game .tower { position: absolute; left: 58%; bottom: 0; width: 7vmin; height: 74vh; background: #f3ead9; border: 3px solid #2b1d2e; border-bottom: 0; transform: translateX(-50%); }
    #game .pod { position: absolute; left: 50%; top: -6vmin; width: 30vmin; height: 7vmin; background: #f3ead9; border: 3px solid #2b1d2e; border-radius: 1vmin; transform: translateX(-50%); box-shadow: inset 0 -2.4vmin 0 #3aa8d8; }
    #game .mast { position: absolute; left: 50%; top: -24vmin; width: 1vmin; height: 18vmin; background: #2b1d2e; transform: translateX(-50%); }
    #game .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14vh; background: linear-gradient(#5cbf5a, #3c9a48); border-top: 3px solid #2b1d2e; }
    #game .wheel { position: absolute; left: 18%; bottom: 10vh; width: 36vmin; height: 36vmin; border-radius: 50%; border: 1.4vmin solid #ef4f43; box-shadow: inset 0 0 0 3px #2b1d2e, 0 0 0 3px #2b1d2e; animation: spin 20s linear infinite; background: repeating-conic-gradient(transparent 0 12deg, rgba(43,29,46,.6) 12deg 14deg); }
    #game .cat { position: absolute; left: 50%; top: 52%; width: 8vmin; height: 6vmin; background: #fff; border: 3px solid #2b1d2e; border-radius: 40% 40% 30% 30%; transform: translate(-50%, -50%); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* dev panel */
    #dev { position: fixed; top: 8px; right: 8px; z-index: 100; width: 270px; max-height: calc(100% - 16px); overflow: auto; font: 12px/1.3 system-ui, sans-serif; color: #eee; background: rgba(18, 16, 30, .92); border: 1px solid #555; border-radius: 8px; padding: 8px; }
    #dev h4 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #ffcb3d; }
    #dev button { font: inherit; margin: 2px; padding: 3px 7px; background: #333; color: #eee; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
    #dev button:hover { background: #444; }
    #dev label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #dev input[type=range] { flex: 1; }
    #dev .row { display: flex; flex-wrap: wrap; }
    #dev pre { margin: 4px 0 0; max-height: 80px; overflow: auto; color: #9fe; font-size: 11px; }
    #devToggle { position: fixed; top: 8px; right: 8px; z-index: 101; font: 12px system-ui; padding: 3px 7px; display: none; }
    body.collapsed #dev { display: none; }
    body.collapsed #devToggle { display: block; }
    body.clean #dev, body.clean #devToggle { display: none !important; }
  </style>
</head>
<body data-bg="sunset">
  <div id="game">
    <div class="sky"></div>
    <div class="wheel"></div>
    <div class="ground"></div>
    <div class="tower"><div class="mast"></div><div class="pod"></div></div>
    <div class="cat"></div>
  </div>
  <div id="ui"></div>

  <button id="devToggle">UI sandbox</button>
  <div id="dev">
    <div class="row"><b style="flex:1">UI sandbox</b><button data-do="collapse">hide</button></div>
    <h4>Screens</h4>
    <div class="row">
      <button data-show="loading">loading</button><button data-do="loadAnim">load anim</button>
      <button data-show="title">title</button><button data-show="play">play</button><button data-show="pause">pause</button>
      <button data-do="claim">claim</button><button data-do="results">results</button><button data-show="none">none</button>
    </div>
    <h4>Results sample</h4>
    <div class="row"><button data-rank="S">S</button><button data-rank="A">A</button><button data-rank="B">B</button><button data-rank="C">C</button></div>
    <h4>HUD</h4>
    <label>hearts <input id="hHearts" type="range" min="0" max="5" value="3"> <span id="hHeartsV"></span></label>
    <label>max <input id="hMax" type="range" min="1" max="5" value="3"></label>
    <label>treats <input id="hTreats" type="range" min="0" max="60" value="12"></label>
    <label>alt m <input id="hAlt" type="range" min="0" max="168" value="42"></label>
    <label><input id="hCharm" type="checkbox"> charm</label>
    <label><input id="hAuto" type="checkbox"> auto climb</label>
    <h4>Messages</h4>
    <div class="row">
      <button data-do="banner">banner</button><button data-do="banner2">long banner</button>
      <button data-do="toast">toast</button><button data-do="toast2">charm toast</button>
      <button data-do="hint">hint</button><button data-do="hint2">hint 2</button><button data-do="hintOff">clear hint</button>
    </div>
    <h4>FX</h4>
    <div class="row"><button data-do="fadeIn">fade in</button><button data-do="fadeOut">fade out</button><button data-do="flashRed">hurt flash</button><button data-do="flashWhite">firework flash</button></div>
    <h4>Device (glyphs)</h4>
    <div class="row"><button data-dev="keyboard">keyboard</button><button data-dev="gamepad">gamepad</button><button data-dev="touch">touch</button></div>
    <h4>Background</h4>
    <div class="row"><button data-bg="sunset">sunset</button><button data-bg="day">bright day</button><button data-bg="night">night</button></div>
    <h4>Events / input</h4>
    <pre id="log"></pre>
  </div>
  <script type="module" src="./ui-sandbox.js"></script>
</body>
</html>
