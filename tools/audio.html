<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indy 3D – audio sandbox</title>
<style>
  :root { --bg: #1d1b26; --panel: #2a2736; --ink: #f3eee4; --dim: #a69fb8; --acc: #ffb347; --on: #6fd08c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 8px; }
  section { background: var(--panel); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: #3a3550; color: var(--ink); border: 1px solid #4b4566; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--acc); }
  button.active { background: var(--acc); color: #1d1b26; border-color: var(--acc); }
  button.big { font-size: 16px; padding: 10px 18px; background: var(--acc); color: #1d1b26; }
  label { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  label span.name { width: 80px; color: var(--dim); }
  label output { width: 120px; font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; max-width: 360px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .meter { height: 14px; background: #15131c; border-radius: 4px; overflow: hidden; position: relative; margin: 4px 0; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--on); }
  .meter i.peak { background: var(--acc); width: 2px; }
  pre { margin: 0; color: var(--dim); font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Indy's Adventure 3D – audio sandbox</h1>
<section>
  <button id="unlock" class="big">Start audio</button>
  <label><input type="checkbox" id="mute"> mute</label>
  <label><span class="name">music vol</span><input type="range" id="musicVol" min="0" max="1" step="0.01" value="0.8"><output></output></label>
  <label><span class="name">sfx vol</span><input type="range" id="sfxVol" min="0" max="1" step="0.01" value="0.9"><output></output></label>
</section>
<div class="cols">
  <section>
    <h2>Music</h2>
    <div class="grid" id="songs"></div>
    <label><span class="name">progress</span><input type="range" id="progress" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><span class="name">section</span><input type="range" id="section" min="0" max="8" step="1" value="0"><output></output></label>
    <label><span class="name">tension</span><input type="range" id="tension" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label><input type="checkbox" id="autoSection" checked> section follows progress</label>
    <div class="grid"><button id="duck">duck 0.6 for 1.5 s</button><button id="climbSweep">auto-climb (2 min)</button></div>
  </section>
  <section>
    <h2>Output</h2>
    <div>RMS <div class="meter"><i id="rmsBar"></i></div></div>
    <div>Peak <div class="meter"><i id="peakBar"></i><i id="peakHold" class="peak"></i></div></div>
    <pre id="info">not started</pre>
  </section>
</div>
<section>
  <h2>Sound effects</h2>
  <label><span class="name">pitch</span><input type="range" id="pitch" min="0.5" max="2" step="0.01" value="1"><output></output></label>
  <label><span class="name">pan</span><input type="range" id="pan" min="-1" max="1" step="0.05" value="0"><output></output></label>
  <label><span class="name">volume</span><input type="range" id="sfxOptVol" min="0" max="1" step="0.01" value="1"><output></output></label>
  <div class="grid" id="sfx"></div>
</section>
<div class="cols">
  <section>
    <h2>Indy's voice</h2>
    <div class="grid" id="meows"></div>
  </section>
  <section>
    <h2>Loops</h2>
    <div class="grid" id="loops"></div>
    <label><span class="name">wind vol</span><input type="range" id="windVol" min="0" max="1" step="0.01" value="0.7"><output></output></label>
  </section>
</div>
<script type="module" src="./audio-sandbox.js"></script>
</body>
</html>
